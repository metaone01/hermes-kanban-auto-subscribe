[pytest]
testpaths = tests
python_files = test_*.py
# The plugin package lives in kanban-auto-subscribe/ (a directory name with hyphens
# is not importable as a package, so tests import auto_subscribe as a plain module).
pythonpath = kanban-auto-subscribe
addopts = -ra --import-mode=importlib
norecursedirs = .git __pycache__
