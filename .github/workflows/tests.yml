name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest hermes-agent

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Verify the plugin manifest matches its directory
        run: |
          set -euo pipefail
          name=$(sed -n 's/^name:[[:space:]]*//p' kanban-auto-subscribe/plugin.yaml | head -1 | tr -d '[:space:]')
          [ "$name" = "kanban-auto-subscribe" ] || { echo "manifest name '$name' != directory"; exit 1; }

  installer:
    name: installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Run the Linux installer
        if: matrix.os == 'ubuntu-latest'
        run: ./install.sh --force --no-deps --no-enable

      - name: Run the macOS installer
        if: matrix.os == 'macos-latest'
        run: ./install-macos.sh --force --no-deps --no-enable

      - name: Run the PowerShell installer
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./install.ps1 -Force -NoDeps -NoEnable

      - name: Verify the installed layout
        shell: bash
        run: |
          set -euo pipefail
          dest="$HOME/.hermes/plugins/kanban-auto-subscribe"
          for f in plugin.yaml __init__.py auto_subscribe.py; do
            [ -f "$dest/$f" ] || { echo "missing $f in $dest"; exit 1; }
          done
          echo "installed files present in $dest"
